services:
  - type: web
    name: campus-doodle
    runtime: node
    plan: free
    rootDir: services/campus-doodle
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://campus-voice-pi.vercel.app
