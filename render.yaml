services:
  - type: web
    name: campus-doodle
    runtime: node
    plan: free
    rootDir: services/campus-doodle
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://campus-voice-pi.vercel.app
      - key: CAMPUS_DOODLE_AUTH_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
  - type: web
    name: mini-soldier-arena-server
    runtime: node
    plan: free
    rootDir: services/mini-soldier-arena/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
  - type: web
    name: mini-soldier-arena-client
    runtime: static
    plan: free
    rootDir: services/mini-soldier-arena/client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SERVER_HOST
        fromService:
          type: web
          name: mini-soldier-arena-server
          property: host
